name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Dependências do frontend
        working-directory: apps/desktop
        run: npm ci

      - name: Testes do núcleo
        run: cargo test -p yourgit-core --locked

      - name: Build do instalador
        working-directory: apps/desktop
        run: npm run tauri -- build --bundles nsis

      - name: Publicar rascunho de release
        uses: softprops/action-gh-release@v2
        with:
          name: YourGit ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: target/release/bundle/nsis/*.exe
          body: |
            Instalador Windows (x64) do YourGit.

            - Baixe `YourGit_*_x64-setup.exe` abaixo.
            - O instalador ainda **não é assinado**; o Windows SmartScreen pode pedir confirmação.
            - A execução de projetos é **nativa** nesta versão. Rode apenas repositórios confiáveis até o sandbox Docker chegar.

            Consulte o [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) para os detalhes.
